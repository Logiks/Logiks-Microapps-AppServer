openapi: 3.0.3
info:
  title: Logiks MicroApps AppServer API
  version: 1.0.0
  description: "REST surface of the Logiks Microapps AppServer, reconstructed from the moleculer service definitions under api/services/**/*.service.js and the moleculer-web route/alias configuration in api/server.js.\n\nAuth: most endpoints live under the private `/api` route and require either a Bearer JWT (`Authorization: Bearer <token>`), an API key (`X-API-Key` header or `api_key` query param), a time-limited token (`tkn` query param), or a server-to-server token (`s2stkn` query param). Endpoints under `/auth/*`, `/webhooks/*`, `/api/public/*`, and `/health` do not require authentication.\n\nNote: because the private `/api` route whitelists `**`, every action documented here under its dedicated mount (`/auth/*`, `/webhooks/*`, `/api/public/*`) is also reachable a second time at `/api/<service>/<path>` (or, for GET, `/api/<...>`), an accidental byproduct of the wildcard whitelist. Only the primary, intended mount is documented here."
servers:
  - url: "http://localhost:9999"
    description: Local development
tags:
  - name: admin
    description: "Admin console: apps, control panels, node/plugin inspection, and admin-owned file/media management."
  - name: application
    description: "Application metadata, layout, navigator, pages, themes, components, and feature settings."
  - name: auth
    description: "Login, token issuance/refresh/verification, federated login, and logout. Public (no bearer auth required)."
  - name: data
    description: Read-only lookup/reference data groups.
  - name: dbops
    description: Generic CRUD-style database operations against configured data sources.
  - name: developers
    description: "Developer tooling: route listing/inspection and the auto-generated OpenAPI spec (dev/UAT only)."
  - name: files
    description: "Tenant file storage: browsing, upload, preview, trash, and purge."
  - name: me
    description: "Current authenticated user's profile, scopes, and password management."
  - name: modules
    description: "Microapp module resolution: components, UI assets, and module-scoped service requests."
  - name: pages
    description: "Public, SEO-friendly page rendering."
  - name: public
    description: "Unauthenticated public endpoints: health checks and public file access."
  - name: query
    description: Stored/raw query execution and management.
  - name: sse
    description: Server-Sent Events streaming.
  - name: system
    description: System/worker-level controls.
  - name: tenant
    description: Tenant lookup.
  - name: test
    description: Internal test endpoints.
  - name: userstates
    description: "Per-user, per-module UI/application state persistence."
  - name: utils
    description: "Misc utilities: rule/validation execution, payload runners, activity logging, and cache inspection."
  - name: webhooks
    description: Inbound webhook receivers.
